<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FERSPAS tile</title>
<link href="https://unpkg.com/maplibre-gl@6.10.0/dist/maplibre-gl.css" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff; --fg: #1a1c1e; --muted: #5d6165;
    --panel: rgba(255,255,255,.92); --line: #d6d9dc; --accent: #0868ac;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14161a; --fg: #e8eaed; --muted: #9aa0a6;
      --panel: rgba(24,27,31,.92); --line: #33373c; --accent: #6bb5e0;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #map { position: absolute; inset: 0; }
  .panel {
    position: absolute; left: 16px; right: 16px; bottom: 16px; z-index: 2;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 16px; backdrop-filter: blur(8px);
    box-shadow: 0 6px 24px rgba(0,0,0,.12);
  }
  @media (min-width: 720px) { .panel { left: 16px; right: auto; width: 620px; } }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .row + .row { margin-top: 10px; }
  h1 { font-size: 15px; margin: 0; font-weight: 600; }
  .muted { color: var(--muted); font-size: 12px; }
  button { font: inherit; color: var(--fg); background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; }
  button:disabled { opacity: .4; cursor: default; }
  /* A phone has no arrow keys and a 6px slider thumb is not a target, so the
     step buttons are the primary control there and get a 44px box. */
  .steps { gap: 8px; }
  .step { flex: none; width: 44px; height: 44px; padding: 0; font-size: 15px;
    line-height: 1; display: inline-flex; align-items: center;
    justify-content: center; }
  #play { flex: none; min-width: 72px; height: 44px; }
  .steps input[type=range] { height: 44px; }
  .back { font-size: 13px; text-decoration: none; color: var(--accent);
    border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; }
  .back:hover { border-color: var(--accent); }
  button { cursor: pointer; min-width: 84px; }
  button:hover { border-color: var(--accent); }
  input[type=range] { flex: 1 1 160px; min-width: 100px; accent-color: var(--accent); }
  @media (max-width: 480px) {
    .panel { padding: 10px 12px; }
    .hint { display: none; }          /* no arrow keys on a phone */
    .steps input[type=range] { flex: 1 1 100%; order: 3; }
  }
  time { font-variant-numeric: tabular-nums; font-weight: 600; min-width: 96px; }
  .ramp { height: 10px; border-radius: 5px; flex: 1 1 140px; min-width: 120px;
    border: 1px solid var(--line); }
  .hint { font-size: 12px; color: var(--muted); }
  .why { margin: 8px 0 0; font-size: 13px; color: var(--muted); }
  details { margin-top: 10px; }
  summary { font-size: 13px; color: var(--accent); cursor: pointer;
    list-style: none; padding: 4px 0; }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: "\25B8 "; display: inline-block;
    transition: transform .15s; }
  details[open] summary::before { transform: rotate(90deg); }
  /* Open on a desktop, folded on a phone: the panel is already most of a
     phone screen and the map is the point. */
  details[open] summary { color: var(--muted); }
  .err { color: #b3261e; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .err { color: #f2b8b5; }
  }
</style>
</head>
<body>
<div id="map"></div>
<div class="panel">
  <div class="row">
    <h1 id="title">loading</h1>
    <span class="muted" id="sub"></span>
  </div>
  <div class="row">
    <a class="back" href="/">&larr; Return to index</a>
    <time id="stamp">&mdash;</time>
    <span class="hint">&larr; &rarr; to step</span>
  </div>
  <div class="row steps">
    <button id="prev" class="step" aria-label="previous month">&#9664;</button>
    <button id="play">play</button>
    <button id="next" class="step" aria-label="next month">&#9654;</button>
    <input type="range" id="slider" min="0" max="0" value="0">
  </div>
  <div class="row">
    <span class="muted" id="lo">&mdash;</span>
    <span class="ramp" id="ramp"></span>
    <span class="muted" id="hi">&mdash;</span>
  </div>
  <details id="about">
    <summary>What am I looking at?</summary>
    <p class="why" id="why"></p>
  </details>
  <div class="row">
    <span class="muted" id="status"></span>
  </div>
</div>
<script type="module">
// MapLibre v6 ships ESM only: there is no UMD bundle and no default export, and
// the worker is a separate file the library cannot find by itself. Without
// setWorkerUrl the map renders the background and never requests a tile.
import { Map, NavigationControl, setWorkerUrl }
  from "https://unpkg.com/maplibre-gl@6.10.0/dist/maplibre-gl.mjs";
setWorkerUrl("https://unpkg.com/maplibre-gl@6.10.0/dist/maplibre-gl-worker.mjs");

const API = location.origin;
const el = (id) => document.getElementById(id);

// The page is its own URL, so what to draw comes from the path:
//   /viewer/analysis/water-balance
//   /viewer/collection/AGERA5-PF
const [, , kind, target] = location.pathname.split("/");
const isAnalysis = kind === "analysis";

let times = [], current = 0, timer = null, meta = null, spec = null;

const map = new Map({
  container: "map",
  style: "https://demotiles.maplibre.org/style.json",
  center: [20, 15], zoom: 1.4, maxZoom: 8,
});
map.addControl(new NavigationControl(), "top-right");
// Reachable from a console or a browser test; nothing in the page reads it.
window.map = map;

const tileUrl = (t) => isAnalysis
  ? `${API}/analysis/${target}/${t}/{z}/{x}/{y}.png`
  : `${API}/tiles/${target}/${t}/{z}/{x}/{y}.png`;

function setFrame(i) {
  if (!times.length) return;
  current = Math.max(0, Math.min(times.length - 1, i));
  const t = times[current];
  el("stamp").textContent = t;
  el("slider").value = current;
  el("prev").disabled = current === 0;
  el("next").disabled = current === times.length - 1;
  const src = map.getSource("ferspas");
  if (src) src.setTiles([tileUrl(t)]);
}

function addLayer() {
  map.addSource("ferspas", {
    type: "raster", tiles: [tileUrl(times[current])], tileSize: 256,
    minzoom: 0, maxzoom: 8, bounds: [-180, -85, 180, 85],
  });
  map.addLayer({ id: "ferspas", type: "raster", source: "ferspas",
    paint: { "raster-opacity": 0.85 } });
}

function paintCollectionRamp(colormap, lo, hi, unit) {
  const stops = [];
  for (let i = 0; i <= 10; i++) {
    const c = colormap?.[Math.round(i * 25.5)];
    if (c) stops.push(`rgba(${c[0]},${c[1]},${c[2]},${(c[3] ?? 255) / 255}) ${i * 10}%`);
  }
  el("ramp").style.background = stops.length
    ? `linear-gradient(90deg, ${stops.join(",")})` : "transparent";
  el("lo").textContent = lo ?? ""; el("hi").textContent = `${hi ?? ""} ${unit ?? ""}`;
}

// Two ramps only, chosen by the analysis's scale kind, so the same colour means
// the same thing on every analysis. Raw collections keep FAO's own ramp.
function paintAnalysisRamp(a) {
  const ramp = a.scale === "diverging"
    ? ["#67001f", "#f7f7f7", "#053061"]
    : ["#440154", "#21918c", "#fde725"];
  el("ramp").style.background = `linear-gradient(90deg, ${ramp.join(",")})`;
  el("lo").textContent = a.rescale[0];
  el("hi").textContent = `${a.rescale[1]} ${a.unit}`;
  el("status").textContent = a.reading;
}

function stopPlaying() {
  if (!timer) return;
  clearInterval(timer);
  timer = null;
  el("play").textContent = "play";
}

// Left and right step through time from anywhere on the page.
//
// Two things are competing for these keys. The range input handles them
// natively when it has focus, so that case is left alone rather than stepping
// twice. MapLibre pans the map with them once the canvas has focus, which is
// why this listens in the capture phase and stops the event: after clicking the
// map to look at something, the arrows should still move time.
// Any hand on the slider stops playback, whether it was dragged or moved with
// the arrows while focused. Setting the value from the timer does not fire
// this, so there is no loop.
el("slider").addEventListener("input", (e) => {
  stopPlaying();
  setFrame(+e.target.value);
});

window.addEventListener("keydown", (e) => {
  if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "select" || tag === "textarea") return;

  e.preventDefault();
  e.stopPropagation();
  step(e.key === "ArrowRight" ? 1 : -1);
}, true);

function step(by) {
  stopPlaying();
  setFrame(current + by);
}

el("prev").addEventListener("click", () => step(-1));
el("next").addEventListener("click", () => step(1));

el("play").addEventListener("click", () => {
  if (timer) { stopPlaying(); return; }
  el("play").textContent = "pause";
  timer = setInterval(() => setFrame(current + 1 >= times.length ? 0 : current + 1), 900);
});

// A phone screen is mostly panel once the explanation is open, so it starts
// folded there and open where there is room.
el("about").open = window.innerWidth > 480;

map.on("load", async () => {
  try {
    // An analysis names its own inputs, so the time axis comes from the first
    // of them rather than from a collection the page happened to be told about.
    let axis = target;
    if (isAnalysis) {
      spec = await (await fetch(`${API}/analysis/${target}`)).json();
      if (spec.detail) throw new Error(spec.detail);
      axis = spec.inputs[0].collection;
    }
    meta = await (await fetch(`${API}/collections/${axis}/timestamps`)).json();
    if (meta.detail) throw new Error(meta.detail);

    times = meta.timestamps;
    current = times.length - 1;
    el("slider").max = times.length - 1;
    document.title = `${spec ? spec.title : meta.title} — ferspas-udf`;
    el("title").textContent = spec ? spec.title : meta.title;
    el("sub").textContent = spec
      ? `${spec.unit} · ${spec.question}`
      : `${meta.unit ?? ""} · ${meta.count.toLocaleString()} frames · ${meta.first} – ${meta.last}`;
    el("why").textContent = spec ? spec.explanation : "";

    addLayer();
    setFrame(current);

    if (spec) {
      paintAnalysisRamp(spec);
    } else {
      const cm = await (await fetch(`${API}/collections/${target}/colormap`)).json();
      const [lo, hi] = meta.rescale ?? [null, null];
      paintCollectionRamp(cm.colormap, lo, hi, meta.unit);
    }
  } catch (err) {
    el("title").textContent = "could not load";
    el("status").innerHTML = `<span class="err">${err}</span>`;
  }
});
</script>
</body>
</html>
